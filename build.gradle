 *
 * This generated file contains a sample Java Library project to get you started.
 * For more details take a look at the Java Libraries chapter in the Gradle
 * User Manual available at https://docs.gradle.org/6.3/userguide/java_library_plugin.html
 */
 
plugins {
    id 'java' 
}

group 'org.ic4j'
version '0.8.5'

sourceCompatibility = 21

repositories {
	mavenLocal()
    mavenCentral()
}


jar {
    manifest {
        attributes('Implementation-Title': 'ic4j-camel',
                   'Implementation-Version': project.version)
    }
    
    archiveBaseName = 'ic4j-camel'
}

task fatJar(type: Jar) {
    manifest {
        attributes('Implementation-Title': 'ic4j-camel',
                   'Implementation-Version': project.version)
    }
    
    archiveBaseName = 'ic4j-camel-with-dependencies'
    
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

test {
    useJUnitPlatform()
}

dependencies {
	implementation platform('org.apache.camel:camel-bom:4.22.0')
	implementation platform('com.fasterxml.jackson:jackson-bom:2.22.2')
	implementation platform('com.squareup.okhttp3:okhttp-bom:5.5.0')
	implementation platform('org.slf4j:slf4j-bom:2.0.19')
	testImplementation platform('org.junit:junit-bom:6.1.3')
	implementation group: 'org.ic4j', name: 'ic4j-candid', version: '0.8.5'
	implementation group: 'org.ic4j', name: 'ic4j-agent', version: '0.8.5'
	implementation group: 'org.ic4j', name: 'ic4j-java11transport', version: '0.8.5'
	implementation 'com.squareup.okhttp3:okhttp-jvm:5.5.0'
	
	// https://mvnrepository.com/artifact/com.google.code.gson/gson
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.14.0'
	
	// https://mvnrepository.com/artifact/org.apache.camel/camel-core
	implementation group: 'org.apache.camel', name: 'camel-core', version: '4.22.0'
	
	implementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.19'
	
	// https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'

	// https://mvnrepository.com/artifact/org.apache.httpcomponents.client5/httpclient5
	implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.6.4'
	
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.22.2'
	
	// https://mvnrepository.com/artifact/jakarta.xml.bind/jakarta.xml.bind-api
	implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.5'
		
	// https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk18on
	implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.85.2'

	// https://mvnrepository.com/artifact/org.bouncycastle/bcpkix-jdk18on
	implementation group: 'org.bouncycastle', name: 'bcpkix-jdk18on', version: '1.85'
	
	// https://mvnrepository.com/artifact/org.apache.camel/camel-test-junit5
	testImplementation group: 'org.apache.camel', name: 'camel-test-junit5', version: '4.22.0'
	
	testImplementation group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.9'
	testImplementation 'javax.xml.bind:jaxb-api:2.3.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// https://mvnrepository.com/artifact/com.sun.xml.bind/jaxb-impl
	testImplementation group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '2.3.9'
	
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-engine
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '6.1.3'
	
	testImplementation group: 'com.prowidesoftware', name: 'pw-iso20022', version: 'SRU2023-9.4.7'
}

sourceSets {
	main {
		java.srcDir 'src/generated/java'
		resources.srcDir 'src/generated/resources'
	}
}

tasks.named('processResources') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processTestResources') {
	from('src/test') {
		include '**/*.xml', '**/*.json', '**/*.properties'
		exclude 'resources/**'
	}
}


