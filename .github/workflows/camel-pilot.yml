name: IC4J Camel dependency pilot
on:
  workflow_dispatch:
  push:
    branches: [ci/camel-dependency-pilot]

permissions:
  contents: read

jobs:
  camel:
    if: >-
      github.repository == 'ic4j/ic4j-camel' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[run camel pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDID_REV: 35933a00ebfaeff6852010deed1633773c19b3a9
      AGENT_REV: 91c425d240ca95187239df662fc8158b6fca234f
      TRANSPORT_REV: e5314fa19bea47eb943e41f6cc6abee784593dcb
      DSCOPE_REV: 3451a34a77ffc86c6856c082e3de791f9a978bec
      TEST_JAVA: '21'
      CI_MAVEN_REPO: ${{ runner.temp }}/ic4j-maven
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: camel
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-candid
          ref: ${{ env.CANDID_REV }}
          path: candid
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-agent
          ref: ${{ env.AGENT_REV }}
          path: agent
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-java11transport
          ref: ${{ env.TRANSPORT_REV }}
          path: transport
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dscope-io/dscope-camel-mcp
          ref: ${{ env.DSCOPE_REV }}
          path: dscope
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.14'
          cache-disabled: true
      - name: Build and test from pinned dependency sources
        run: bash camel/ci/run-camel-pilot.sh
      - name: Preserve reports and dependency evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camel-java21-reports
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ic4j-pilot-reports/
            ${{ runner.temp }}/camel-pilot-reports/
            dscope/target/surefire-reports/TEST-*.xml
            camel/ic4j-camel-core/target/surefire-reports/TEST-*.xml
            camel/ic4j-camel-mcp/target/surefire-reports/TEST-*.xml
