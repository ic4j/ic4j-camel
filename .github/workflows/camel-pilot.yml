name: IC4J Camel dependency pilot
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [ci/camel-dependency-pilot]

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.repository == 'ic4j/ic4j-camel' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[run camel pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Check whether the PR only changes Markdown
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          run=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" |
              jq -es --argjson expected "$CHANGED_FILES" '
                [ .[][] ] as $files
                | ($expected > 0) and ($expected < 3000)
                  and (($files | length) == $expected)
                  and all($files[];
                    (.filename | endswith(".md"))
                    and ((.previous_filename // .filename) | endswith(".md")))
              ' >/dev/null; then
            run=false
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
          printf 'Run integration tests: %s\n' "$run"

  camel:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDID_REV: 35933a00ebfaeff6852010deed1633773c19b3a9
      AGENT_REV: 67dd09c1eb18583834b7772dbca5515297cea853
      TRANSPORT_REV: e5314fa19bea47eb943e41f6cc6abee784593dcb
      DSCOPE_REV: b016db0025a14e98a61c2246ddf8f0aca021871e
      TEST_JAVA: '21'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: camel
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-candid
          ref: ${{ env.CANDID_REV }}
          path: candid
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-agent
          ref: ${{ env.AGENT_REV }}
          path: agent
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-java11transport
          ref: ${{ env.TRANSPORT_REV }}
          path: transport
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dscope-io/dscope-camel-mcp
          ref: ${{ env.DSCOPE_REV }}
          path: dscope
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.14'
          cache-disabled: true
      - name: Build and test from pinned dependency sources
        env:
          CI_MAVEN_REPO: ${{ runner.temp }}/ic4j-maven
        run: bash camel/ci/run-camel-pilot.sh
      - name: Preserve reports and dependency evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camel-java21-reports
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ic4j-pilot-reports/
            ${{ runner.temp }}/camel-pilot-reports/
            candid/build/test-results/test/TEST-*.xml
            agent/build/test-results/test/TEST-*.xml
            dscope/target/surefire-reports/TEST-*.xml
            camel/ic4j-camel-core/target/surefire-reports/TEST-*.xml
            camel/ic4j-camel-mcp/target/surefire-reports/TEST-*.xml
            camel/ci/kafka-smoke/target/surefire-reports/TEST-*.xml

  pr-checks:
    name: IC4J Camel PR checks
    needs: [changes, camel]
    if: ${{ always() && github.event_name == 'pull_request' && github.repository == 'ic4j/ic4j-camel' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report result
        env:
          CLASSIFY: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.run }}
          TESTS: ${{ needs.camel.result }}
        run: |
          test "$CLASSIFY" = success
          case "$SELECTED:$TESTS" in
            false:skipped) echo "Markdown-only PR; integration tests not needed." ;;
            true:success) echo "Integration tests passed." ;;
            *) echo "Integration test result: $TESTS (selected: $SELECTED)"; exit 1 ;;
          esac
